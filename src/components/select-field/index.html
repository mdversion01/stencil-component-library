<!doctype html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stencil Component Starter</title>

    <script type="module" src="../../build/stencil-component-library.esm.js"></script>
    <script nomodule src="../../build/stencil-component-library.js"></script>

    <link rel="stylesheet" href="../../build/stencil-component-library.css" />

    <link rel="stylesheet" href="../../assets/mdi/materialdesignicons.min.css" />

    <style>
      .theme-switcher {
        margin: 10px;
      }

      .cwrapper {
        margin: 10px;
      }

      button {
        border: 1px solid #ccc;
        border-radius: 3px;
      }

      .purple {
        background-color: purple !important;
        color: white !important;
      }
    </style>
  </head>
  <body>
    <div class="theme-switcher">
      <button id="bootstrap-theme-toggle" type="button" class="btn btn-outline-secondary" aria-pressed="false" aria-label="Switch to dark mode">Dark mode</button>
    </div>
    <!-- <my-component first="Stencil" middle="'Don't call me a framework'" last="JS"></my-component>
     -->
    <app-wrapper>
      <div class="cwrapper">
        <select-field-component
          label="Favorite Fruit"
          select-field-id="fruit1"
          form-layout="horizontal"
          label-align="right"
          value=""
          options='[
          {"value":"apple","name":"Apple"},
          {"value":"banana","name":"Banana"},
          {"value":"cherry","name":"Cherry"}
        ]'
          custom
          validation-message="Please select an option."
          required
          validation
        ></select-field-component>

        <select-field-component
          label="Favorite Fruit"
          label-size="lg"
          size="sm"
          select-field-id="fruit2"
          form-layout="horizontal"
          label-align="right"
          value=""
          options='[
          {"value":"apple","name":"Apple"},
          {"value":"banana","name":"Banana"},
          {"value":"cherry","name":"Cherry"}
        ]'
        ></select-field-component>

        <select-field-component
          label="Favorite Fruit"
          size="lg"
          form-layout="horizontal"
          label-align="right"
          select-field-id="fruit3"
          value=""
          multiple
          field-height="5"
          options='[
          {"value":"apple","name":"Apple"},
          {"value":"banana","name":"Banana"},
          {"value":"cherry","name":"Cherry"}
        ]'
        ></select-field-component>

        <select-field-component
          label="Favorite Fruit"
          size="lg"
          form-layout="horizontal"
          label-align="right"
          select-field-id="fruit4"
          value=""
          options='[
          {"value":"apple","name":"Apple"},
          {"value":"banana","name":"Banana"},
          {"value":"cherry","name":"Cherry"}
        ]'
          validation-message="Please select an option."
          required
          validation
        ></select-field-component>

        <select-field-component
          label="Favorite Fruit"
          size="lg"
          form-layout="horizontal"
          label-align="right"
          select-field-id="fruit5"
          value=""
          read-only
          options='[
          {"value":"apple","name":"Apple"},
          {"value":"banana","name":"Banana"},
          {"value":"cherry","name":"Cherry"}
        ]'
          validation-message="Please select an option."
          required
          validation
        ></select-field-component>

        <select-field-component
          label="Favorite Fruit"
          size="lg"
          form-layout="horizontal"
          label-align="right"
          select-field-id="fruit6"
          disabled
          value=""
          options='[
          {"value":"apple","name":"Apple"},
          {"value":"banana","name":"Banana"},
          {"value":"cherry","name":"Cherry"}
        ]'
          validation-message="Please select an option."
          required
          validation
        ></select-field-component>
      </div>
    </app-wrapper>

    <script type="module">
      (() => {
        const STORAGE_KEY = 'bootstrap-demo-theme';
        const html = document.documentElement;
        const toggle = document.getElementById('bootstrap-theme-toggle');

        function applyTheme(theme) {
          const normalizedTheme = theme === 'dark' ? 'dark' : 'light';
          const isDark = normalizedTheme === 'dark';

          html.setAttribute('data-bs-theme', normalizedTheme);

          toggle.setAttribute('aria-pressed', String(isDark));
          toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
          toggle.textContent = isDark ? 'Light mode' : 'Dark mode';
        }

        function getInitialTheme() {
          const storedTheme = localStorage.getItem(STORAGE_KEY);

          if (storedTheme === 'light' || storedTheme === 'dark') {
            return storedTheme;
          }

          return html.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
        }

        applyTheme(getInitialTheme());

        toggle.addEventListener('click', () => {
          const currentTheme = html.getAttribute('data-bs-theme');
          const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

          localStorage.setItem(STORAGE_KEY, nextTheme);
          applyTheme(nextTheme);
        });
      })();
    </script>
  </body>
</html>
