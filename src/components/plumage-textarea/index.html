<!doctype html>
<html dir="ltr" lang="en" class="plmg-lt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stencil Component Starter</title>

    <script type="module" src="../../build/stencil-component-library.esm.js"></script>
    <script nomodule src="../../build/stencil-component-library.js"></script>

    <link rel="stylesheet" href="../../build/stencil-component-library.css" />

    <link rel="stylesheet" href="../../assets/mdi/materialdesignicons.min.css" />

    <style>
        .plmg-lt {
        body {
          background-color: #fff;
          color: #383838;
        }
      }

      .plmg-dk {
        body {
          background-color: #323232;
          color: #f2f2f2;
        }
      }

      .theme-switcher {
        margin: 10px;
      }

      .cwrapper {
        margin: 10px;
      }

       button {
        border: 1px solid #ccc;
        border-radius: 3px;
      }

    </style>
  </head>
  <body>
    <div class="theme-switcher">
      <button id="plumage-theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">Dark mode</button>
    </div>
    <!-- <my-component first="Stencil" middle="'Don't call me a framework'" last="JS"></my-component>
     -->
    <app-wrapper>
      <div class="cwrapper">
        <plumage-textarea-component label="Comments" disabled label-size="xs" textarea-text-size="sm" value="" input-id="textarea-comments" form-layout="horizontal" label-align="right"></plumage-textarea-component>

        <plumage-textarea-component label="Details" read-only value="" max-length="500" input-id="textarea-details" label-size="base" size="" form-layout="horizontal" label-align="right"></plumage-textarea-component>

        <plumage-textarea-component label="Thoughts" value="" max-length="500" input-id="textarea-thoughts" textarea-text-size="lg" form-layout="inline" label-size="xs" label-align="right"></plumage-textarea-component>
      </div>
      <div class="cwrapper">
        <form-component>
          <plumage-textarea-component
            required
            validation
            validation-message="Please enter comments"
            label="Comments"
            label-size="sm"
            textarea-text-size="sm"
            value=""
            input-id="textarea-input-5"
            slot="formField"
            rows="1"
            max-length="500"
            form-layout="inline"
          ></plumage-textarea-component>

          <plumage-textarea-component
            required
            validation
            validation-message="Please enter details"
            label="Details"
            value=""
            input-id="textarea-input-6"
            slot="formField"
            rows="2"
          ></plumage-textarea-component>

          <plumage-textarea-component
            required
            validation
            validation-message="Please enter thoughts"
            label="Thoughts"
            value=""
            input-id="textarea-input-6"
            slot="formField"
            textarea-text-size="lg"
            label-size="lg"
          ></plumage-textarea-component>
        </form-component>
      </div>
    </app-wrapper>

    <script type="module">

       (() => {
        const STORAGE_KEY = 'plumage-demo-theme';

        const html = document.documentElement;

        const toggle = document.getElementById('plumage-theme-toggle');

        if (!toggle) {
          return;
        }

        const applyTheme = theme => {
          const isDark = theme === 'dark';

          const html = document.documentElement;

          html.classList.remove('plmg-lt', 'plmg-dk');

          html.classList.add(isDark ? 'plmg-dk' : 'plmg-lt');

          toggle.setAttribute('aria-pressed', String(isDark));

          toggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');

          toggle.textContent = isDark ? 'Light mode' : 'Dark mode';
        };

        const getInitialTheme = () => {
          const storedTheme = localStorage.getItem(STORAGE_KEY);

          if (storedTheme === 'light' || storedTheme === 'dark') {
            return storedTheme;
          }

          return html.classList.contains('plmg-dk') ? 'dark' : 'light';
        };

        applyTheme(getInitialTheme());

        toggle.addEventListener('click', () => {
          const currentTheme = html.classList.contains('plmg-dk') ? 'dark' : 'light';

          const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

          localStorage.setItem(STORAGE_KEY, nextTheme);

          applyTheme(nextTheme);
        });
      })();


    </script>
  </body>
</html>
